name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff + mypy)
    runs-on: ubuntu-latest

    # The integration suite (ingestion, webhooks, storage, end-to-end) talks to
    # a real MongoDB at mongodb://localhost:27017 — see tests/conftest.py.
    # Without this service those tests silently skip, which is how 59 of them
    # went unrun for so long.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pipx install poetry==1.8.3

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint (ruff)
        run: |
          poetry run ruff check bhulan/ scripts/ tests/

      - name: Typecheck (mypy)
        run: |
          poetry run mypy bhulan/

      - name: Run all unit + integration tests
        env:
          PYTHONPATH: .
          # Fail loudly if the mongo service above is not reachable, rather
          # than silently skipping the integration suite and reporting green.
          BHULAN_REQUIRE_MONGO: "1"
        run: |
          poetry run pytest \
            tests/unit/ \
            tests/integration/ \
            tests/adversary/ \
            --no-cov -q -rs

      - name: Verify OpenAPI schema is up to date
        env:
          # poetry install --no-root above skips bhulan itself, so expose the
          # source tree on PYTHONPATH for the export script.
          PYTHONPATH: .
        run: |
          poetry run python scripts/export_openapi.py
          if ! git diff --quiet openapi.json; then
            echo "::error ::openapi.json is out of date; run 'poetry run python scripts/export_openapi.py' and commit the result"
            git --no-pager diff openapi.json
            exit 1
          fi

  frontend:
    name: Frontend (vitest + build + codegen check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck + build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify generated API types are up to date
        run: npm run gen:api:check
