services:
  - type: web
    name: bhulan
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/healthz
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: BHULAN_AUTH_ENABLED
        value: "false"
      - key: AUTH_DEV_MODE
        value: "false"
      - key: ENABLE_PROMETHEUS
        value: "false"
      - key: API_KEY
        sync: false
      - key: RATE_LIMIT_INSIGHTS
        value: 30/minute
      - key: RATE_LIMIT_PLOT
        value: 60/minute
      - key: WEB_DIST_DIR
        value: /app/web/dist
